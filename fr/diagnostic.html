<style>
/* Layout: wine hero band over paper ground, one-column stepper; results printed as a restaurant bill. */
:root {
  --paper: #F6F0E8;
  --sand: #E9DDCF;
  --ink: #241A18;
  --ink-soft: #5E4E49;
  --wine: #641B26;
  --wine-ink: #F6F0E8;
  --line: rgba(36, 26, 24, .18);
  --bill: #FFFCF7;
  --good: #2F6B45;
  --warn: #9A5B12;
  --bad: #A3313F;
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Satoshi", "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --max: 1080px;
  --gutter: clamp(16px, 4vw, 48px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1C1413; --sand: #2A1F1D; --ink: #F1E8DE; --ink-soft: #BFAFA6;
    --wine: #7A2532; --wine-ink: #F6F0E8; --line: rgba(241, 232, 222, .18);
    --bill: #241A18; --good: #7BC495; --warn: #E2A75A; --bad: #EE8A95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1C1413; --sand: #2A1F1D; --ink: #F1E8DE; --ink-soft: #BFAFA6;
  --wine: #7A2532; --wine-ink: #F6F0E8; --line: rgba(241, 232, 222, .18);
  --bill: #241A18; --good: #7BC495; --warn: #E2A75A; --bad: #EE8A95;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a:focus-visible, :root:not([data-theme="light"]) button:focus-visible { outline-color: var(--ink); } }
.wrap { max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }
.label { font: 500 12px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--ink-soft); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 62ch; }

/* Header */
.bar { border-bottom: 1px solid rgba(246,240,232,.25); background: var(--wine); color: var(--wine-ink); }
.bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 16px; }
.brand { font: 400 22px/1 var(--display); text-decoration: none; }
.lang { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid rgba(246,240,232,.4); border-radius: 999px; }
.lang button { font: 500 12px/1 var(--body); letter-spacing: .1em; padding: 8px 14px; border-radius: 999px; border: 0; background: none; color: inherit; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--wine-ink); color: var(--wine); }

/* Hero */
.hero { background: var(--wine); color: var(--wine-ink); }
.hero .wrap { padding-block: clamp(36px, 7vw, 88px) clamp(32px, 5vw, 64px); display: grid; gap: 20px; }
.hero h1 { font-size: clamp(44px, 8.5vw, 112px); line-height: .98; text-transform: uppercase; max-width: 14ch; }
.hero h1 em { font-style: italic; text-transform: none; }
.hero p { font: 400 clamp(19px, 2.2vw, 26px)/1.35 var(--display); max-width: 36ch; opacity: .92; }
.pillars { display: flex; flex-wrap: wrap; gap: 8px; }
.pillars span { border: 1px solid rgba(246,240,232,.4); border-radius: 999px; padding: 6px 12px; }

main { padding-block: clamp(32px, 6vw, 72px); }

/* Steps */
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 28px; }
.progress i { height: 3px; background: var(--line); border-radius: 2px; }
.progress i.on { background: var(--wine); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .progress i.on { background: var(--ink); } }
:root[data-theme="dark"] .progress i.on { background: var(--ink); }
.step-head { display: grid; gap: 10px; margin-bottom: 28px; }
.step-head h2 { font-size: clamp(34px, 5vw, 60px); line-height: 1.02; text-transform: uppercase; }

.intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
@media (max-width: 820px) { .intro { grid-template-columns: 1fr; } }
.fields { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 500; }
.field .hint { font-size: 14px; }
input[type="text"], input[type="email"], input[type="tel"] {
  font: 400 17px/1.4 var(--body); color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--ink-soft); padding: 10px 2px; width: 100%; border-radius: 0;
}
input::placeholder { color: var(--ink-soft); opacity: .7; }
input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus { outline: none; border-bottom: 2px solid var(--wine); padding-bottom: 9px; }

.q { border: 0; margin: 0; padding: 22px 0; border-top: 1px solid var(--line); display: grid; gap: 14px; min-width: 0; }
.q legend { padding: 0; font: 400 clamp(20px, 2.2vw, 25px)/1.3 var(--display); margin-bottom: 14px; max-width: 46ch; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-block; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.opt:hover span { border-color: var(--ink-soft); }
.opt input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.opt input:focus-visible + span { outline: 2px solid var(--wine); outline-offset: 3px; }

.helper { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--sand); padding: 16px 18px; border-radius: 2px; margin-bottom: 8px; }
.helper code { font: 400 14px/1.4 var(--mono); }
.helper a { font-weight: 500; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 28px; }
.btn { font: 500 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; padding: 16px 24px; border-radius: 999px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); text-decoration: none; display: inline-block; }
.btn:hover { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); color: var(--ink); background: none; }
.btn.small { padding: 10px 14px; }
.err { color: var(--bad); font-size: 15px; }

/* The bill */
.bill { background: var(--bill); color: var(--ink); font: 400 15px/1.5 var(--mono); padding: 26px 24px 30px; border: 1px solid var(--line); box-shadow: 0 18px 40px -24px rgba(36,26,24,.35); position: relative; font-variant-numeric: tabular-nums; }
.bill::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px; background: radial-gradient(circle at 6px 0, transparent 5px, var(--bill) 5.5px) 0 0 / 12px 10px repeat-x; }
.bill .tag-ex { display: inline-block; font: 500 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border: 1px dashed var(--ink-soft); color: var(--ink-soft); margin-bottom: 14px; }
.bill .bh { text-align: center; display: grid; gap: 2px; padding-bottom: 14px; border-bottom: 1px dashed var(--ink-soft); }
.bill .bh strong { font: 400 24px/1.15 var(--display); }
.bill .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; }
.bill .row .meter { display: block; height: 4px; background: var(--sand); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.bill .row .meter b { display: block; height: 100%; border-radius: 2px; }
.bill .lines { padding-block: 10px; border-bottom: 1px dashed var(--ink-soft); }
.bill .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.bill .total .n { font: 400 54px/1 var(--display); }
.bill .total .n small { font: 400 20px/1 var(--mono); color: var(--ink-soft); }
.bill .foot { text-align: center; color: var(--ink-soft); margin-top: 14px; font-size: 13px; }
.c-good { background: var(--good); } .c-warn { background: var(--warn); } .c-bad { background: var(--bad); }
.t-good { color: var(--good); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); }

/* Results */
.results { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
@media (max-width: 860px) { .results { grid-template-columns: 1fr; } }
.verdict { display: grid; gap: 12px; margin-bottom: 30px; }
.verdict h2 { font-size: clamp(36px, 5vw, 62px); line-height: 1; text-transform: uppercase; }
.wins { list-style: none; padding: 0; margin: 0; display: grid; }
.wins li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 16px; padding: 18px 0; border-top: 1px solid var(--line); }
.wins .num { font: 400 30px/1 var(--display); color: var(--wine); grid-row: span 2; min-width: 1.2em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wins .num { color: var(--ink-soft); } }
:root[data-theme="dark"] .wins .num { color: var(--ink-soft); }
.wins h3 { font-size: 21px; line-height: 1.25; }
.wins .gain { font-size: 13px; }

.lead { margin-top: 40px; background: var(--wine); color: var(--wine-ink); padding: clamp(24px, 4vw, 40px); border-radius: 2px; display: grid; gap: 18px; }
.lead h2 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.05; }
.lead p { opacity: .92; }
.lead .fields { grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .lead .fields { grid-template-columns: 1fr; } }
.lead .field.full { grid-column: 1 / -1; }
.lead input[type="text"], .lead input[type="email"], .lead input[type="tel"] { color: var(--wine-ink); border-bottom-color: rgba(246,240,232,.55); }
.lead input::placeholder { color: rgba(246,240,232,.7); }
.lead input:focus { border-bottom-color: var(--wine-ink) !important; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
.consent input { margin-top: 3px; accent-color: var(--wine-ink); width: 18px; height: 18px; flex: none; }
.lead .btn { background: var(--wine-ink); color: var(--wine); border-color: var(--wine-ink); justify-self: start; }
.lead .btn:hover { background: transparent; color: var(--wine-ink); }
.lead .btn.ghost { background: none; color: var(--wine-ink); border-color: rgba(246,240,232,.5); }
.lead .err { color: #FFD3D8; }
.mailbox { display: grid; gap: 12px; }
.mailbox code { font: 400 15px/1.4 var(--mono); background: rgba(0,0,0,.18); padding: 8px 12px; border-radius: 2px; word-break: break-all; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 14px; }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .35s ease-out both; }
  @keyframes rise { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bill .meter b { transition: width .6s ease-out; }
}
</style>

const DEFAULT_LANG = "fr";
/* ============================================ */

const PILLARS = [
  { id: "maps", name: { fr: "Google Maps", en: "Google Maps" },

        o: [["Oui, tout est à jour", "Yes, all up to date", 9], ["Revendiquée mais incomplète", "Claimed but incomplete", 5], ["Je ne sais pas qui la gère", "Not sure who manages it", 2], ["Non / je ne sais pas", "No / I don't know", 0]],

        fix: { fr: ["Répondez à chaque avis sous 48 h", "Citez un plat ou un détail du repas. Google en tient compte, et les futurs clients lisent vos réponses."],
               en: ["Reply to every review within 48 h", "Mention a dish or a detail from the meal. Google takes it into account, and future guests read your replies."] } }

  { id: "search", name: { fr: "Recherche Google", en: "Google Search" },
    desc: { fr: "Ce qui apparaît quand on cherche votre cuisine dans votre ville.", en: "What shows up when people search your cuisine in your city." },
    qs: [
      { id: "s1", q: { fr: "Avez-vous un site avec votre menu en texte (pas seulement un PDF ou une photo) ?", en: "Do you have a website with your menu as text (not only a PDF or photo)?" },
        o: [["Oui, menu en texte", "Yes, menu as text", 9], ["Oui, menu en PDF ou image", "Yes, menu as PDF or image", 5], ["Juste TheFork ou les réseaux", "Only TheFork or social media", 2], ["Pas de site", "No website", 0]],

               en: ["Put your menu on your site as text", "Google and AI tools read PDFs and menu photos poorly. Dish names as text help you show up for those searches."] } },
      { id: "s2", q: { fr: "Quand vous cherchez « {cuisine} {city} » sur Google, où apparaissez-vous ?", en: "When you search “{cuisine} {city}” on Google, where do you appear?" },
        o: [["Dans les 3 premiers sur la carte", "Top 3 on the map", 9], ["Sur la première page", "On the first page", 6], ["Plus loin", "Further down", 2], ["Je ne me trouve pas", "I can't find myself", 0]],

let SOURCE = "site";
try { SOURCE = (new URLSearchParams(location.search).get("src") || "site").slice(0, 40); } catch (e) {}
const state = { lang: "fr", step: 0, info: { name: "", city: "", cuisine: "" }, answers: {}, lead: { first: "", email: "", phone: "", ok: false }, status: "idle", error: "" };
state.lang = DEFAULT_LANG === "en" ? "en" : "fr";
try { const s = JSON.parse(localStorage.getItem("vis-score") || "null"); if (s && s.info) { Object.assign(state.info, s.info); Object.assign(state.answers, s.answers || {}); } } catch (e) {}

const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = () => T[state.lang];
const L = () => state.lang === "fr" ? 0 : 1;
const cuisine = () => state.info.cuisine.trim() || t().defaultCuisine;
const fill = (s) => s.replace(/\{cuisine\}/g, esc(cuisine())).replace(/\{city\}/g, esc(state.info.city.trim()));
const fillPlain = (s) => s.replace(/\{cuisine\}/g, cuisine()).replace(/\{city\}/g, state.info.city.trim());
function save() { try { localStorage.setItem("vis-score", JSON.stringify({ info: state.info, answers: state.answers })); } catch (e) {} }

function pts(q) { const i = state.answers[q.id]; return i == null ? 0 : q.o[i][2]; }
const maxPts = (q) => Math.max(...q.o.map((o) => o[2]));
function scores() {
  const per = PILLARS.map((p) => ({ p, s: p.qs.reduce((a, q) => a + pts(q), 0), m: p.qs.reduce((a, q) => a + maxPts(q), 0) }));
  return { per, total: per.reduce((a, x) => a + x.s, 0) };
}
const tone = (r) => r >= .7 ? "good" : r >= .45 ? "warn" : "bad";
function band(total) { let b = t().bands[0]; for (const x of t().bands) if (total >= x[0]) b = x; return b; }
function wins() {
  const all = [];
  PILLARS.forEach((p) => p.qs.forEach((q) => all.push({ p, q, gap: maxPts(q) - pts(q) })));
  return all.filter((x) => x.gap > 0).sort((a, b) => b.gap - a.gap).slice(0, 3);
}

function billHTML(name, city, rows, total, example) {
  const date = new Date().toLocaleDateString(state.lang === "fr" ? "fr-FR" : "en-GB", { day: "2-digit", month: "2-digit", year: "numeric" });
  return `<div class="bill">
    ${example ? `<span class="tag-ex">${t().sample}</span>` : ""}
    <div class="bh"><strong>${esc(name)}</strong><span class="muted">${esc(city)}</span><span class="muted">${t().billTable} · ${date}</span></div>
    <div class="lines">${rows.map((r) => `<div class="row"><div style="flex:1;min-width:0">${esc(r.name)}<span class="meter"><b class="c-${tone(r.s / r.m)}" style="width:${Math.round(r.s / r.m * 100)}%"></b></span></div><span>${r.s}/${r.m}</span></div>`).join("")}</div>
    <div class="total"><span class="label">${t().total}</span><span class="n t-${tone(total / 100)}">${total}<small> /100</small></span></div>
    <div class="foot">${t().thanks}</div>
  </div>`;
}

function renderChrome() {
  document.documentElement.lang = state.lang;
  document.getElementById("h-eyebrow").textContent = t().eyebrow;
  document.getElementById("h-title").innerHTML = t().title;
  document.getElementById("h-lede").textContent = t().lede;
  document.getElementById("h-p2").textContent = t().p2;
  document.getElementById("h-p3").textContent = t().p3;
  document.getElementById("f-left").textContent = "© 2026 Acile Harb · " + t().footer;
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang ? "true" : "false"));
}
const progress = () => `<div class="progress" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<i class="${i <= state.step ? "on" : ""}"></i>`).join("")}</div>`;

function renderIntro() {
  const sampleRows = [["Google Maps", 14], [t().p2, 11], [t().p3, 4], ["Instagram", 17]].map(([n, s]) => ({ name: n, s, m: 25 }));
  app.innerHTML = `<div class="screen">${progress()}
  <div class="intro">
    <form id="f-intro" class="fields" novalidate>
      <div class="step-head"><span class="label muted">${t().step(1)}</span><h2>${t().startTitle}</h2><p class="muted">${t().startSub}</p></div>
      <div class="field"><label for="in-name">${t().fName}</label><input id="in-name" type="text" autocomplete="organization" placeholder="${esc(t().fNamePh)}" value="${esc(state.info.name)}"></div>
      <div class="field"><label for="in-city">${t().fCity}</label><input id="in-city" type="text" autocomplete="address-level2" placeholder="${esc(t().fCityPh)}" value="${esc(state.info.city)}"></div>
      <div class="field"><label for="in-cuisine">${t().fCuisine}</label><input id="in-cuisine" type="text" placeholder="${esc(t().fCuisinePh)}" value="${esc(state.info.cuisine)}"><span class="hint muted">${t().fCuisineHint}</span></div>
      <p class="err" id="intro-err" hidden></p>
      <div class="nav"><button class="btn" type="submit">${t().start}</button></div>
    </form>
    <aside aria-label="${t().sample}">${billHTML(t().sampleName, t().sampleCity, sampleRows, 46, true)}</aside>
  </div></div>`;
  const f = document.getElementById("f-intro");
  ["name", "city", "cuisine"].forEach((k) => document.getElementById("in-" + k).addEventListener("input", (e) => { state.info[k] = e.target.value; save(); }));
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!state.info.name.trim() || !state.info.city.trim()) { const er = document.getElementById("intro-err"); er.textContent = t().needInfo; er.hidden = false; return; }
    go(1);
  });
}

function helperHTML(p) {
  const n = state.info.name.trim(), c = state.info.city.trim();
  if (p.id === "maps") return `<div class="helper"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n + " " + c)}" target="_blank" rel="noopener">${esc(t().checkMaps(n))}</a></div>`;
  if (p.id === "search") { const q = cuisine() + " " + c; return `<div class="helper"><a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(t().checkSearch(q))}</a></div>`; }
  if (p.id === "ai") { const pr = t().aiPrompt(cuisine(), c); return `<div class="helper"><span>${t().testAI}</span><code id="ai-prompt">${esc(pr)}</code><button class="btn ghost small" type="button" id="copy-ai">${t().copy}</button><a href="https://chatgpt.com/?q=${encodeURIComponent(pr)}" target="_blank" rel="noopener">${t().askAI}</a></div>`; }
  return "";
}

function renderPillar(idx) {
  const p = PILLARS[idx];
  app.innerHTML = `<div class="screen">${progress()}
    <div class="step-head"><span class="label muted">${t().step(idx + 2)}</span><h2>${esc(p.name[state.lang])}</h2><p class="muted">${esc(p.desc[state.lang])}</p></div>
    ${helperHTML(p)}
    <form id="f-p" novalidate>
      ${p.qs.map((q) => `<fieldset class="q"><legend>${fill(q.q[state.lang])}</legend><div class="opts">
        ${q.o.map((o, i) => `<label class="opt"><input type="radio" name="${q.id}" id="${q.id}-${i}" value="${i}" ${state.answers[q.id] === i ? "checked" : ""}><span>${esc(o[L()])}</span></label>`).join("")}
      </div></fieldset>`).join("")}
      <p class="err" id="p-err" hidden></p>
      <div class="nav"><button class="btn ghost" type="button" id="back">${t().back}</button><button class="btn" type="submit">${idx === 3 ? t().seeScore : t().next}</button></div>
    </form></div>`;
  app.querySelectorAll('input[type="radio"]').forEach((r) => r.addEventListener("change", () => { state.answers[r.name] = Number(r.value); save(); }));
  document.getElementById("back").addEventListener("click", () => go(idx));
  const cp = document.getElementById("copy-ai");
  if (cp) cp.addEventListener("click", () => copyText(document.getElementById("ai-prompt").textContent, cp, document.getElementById("ai-prompt")));
  document.getElementById("f-p").addEventListener("submit", (e) => {
    e.preventDefault();
    if (p.qs.some((q) => state.answers[q.id] == null)) { const er = document.getElementById("p-err"); er.textContent = t().needAll; er.hidden = false; return; }
    go(idx + 2);
  });
}

function summaryText() {
  const { per, total } = scores();
  const lines = [
    `${state.info.name.trim()} · ${state.info.city.trim()} · ${cuisine()}`,
    `${t().yourScore}: ${total}/100 (${band(total)[1]})`,
    `Source: ${SOURCE}`,
    ...per.map((x) => `- ${x.p.name[state.lang]}: ${x.s}/${x.m}`),
    "",
    t().winsTitle + ":",
    ...wins().map((w, i) => `${i + 1}. ${w.q.fix[state.lang][0].replace(/\{cuisine\}/g, cuisine()).replace(/\{city\}/g, state.info.city.trim())}`),
    "",
    ...PILLARS.flatMap((p) => p.qs.map((q) => `${fillPlain(q.q[state.lang])} → ${state.answers[q.id] != null ? q.o[state.answers[q.id]][L()] : "-"}`))
  ];
  if (state.lead.first) lines.unshift(`${state.lead.first} · ${state.lead.email}${state.lead.phone ? " · " + state.lead.phone : ""}`, "");
  return lines.join("\n");
}

function leadHTML() {
  if (state.status === "sent") return `<div class="lead"><h2>${esc(t().sentTitle(state.lead.first))}</h2><p>${t().sentText}</p></div>`;
  if (state.status === "mail") {
    const href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t().subject(state.info.name.trim()))}&body=${encodeURIComponent(summaryText())}`;
    return `<div class="lead mailbox"><h2>${t().mailTitle}</h2><p>${t().mailText}</p><code id="mail-addr">${CONTACT_EMAIL}</code>
      <div class="row-btns"><a class="btn" href="${href}">${t().mailBtn}</a><button class="btn ghost" type="button" id="copy-sum">${t().copySummary}</button><button class="btn ghost" type="button" id="copy-mail">${t().copyEmail}</button></div></div>`;
  }
  const l = state.lead;
  return `<form class="lead" id="f-lead" novalidate>
    <h2>${t().leadTitle}</h2><p>${t().leadText}</p>
    <div class="fields">
      <div class="field"><label for="l-first">${t().lFirst}</label><input id="l-first" type="text" autocomplete="given-name" value="${esc(l.first)}"></div>
      <div class="field"><label for="l-email">${t().lEmail}</label><input id="l-email" type="email" autocomplete="email" value="${esc(l.email)}"></div>
      <div class="field full"><label for="l-phone">${t().lPhone}</label><input id="l-phone" type="tel" autocomplete="tel" value="${esc(l.phone)}"></div>
      <div class="hp" aria-hidden="true"><label for="l-hp">Website</label><input id="l-hp" type="text" tabindex="-1" autocomplete="off"></div>
      <label class="consent field full"><input id="l-ok" type="checkbox" ${l.ok ? "checked" : ""}><span>${t().consent}</span></label>
    </div>
    <p class="err" id="lead-err" ${state.error ? "" : "hidden"}>${esc(state.error)}</p>
    <button class="btn" type="submit" ${state.status === "sending" ? "disabled" : ""}>${state.status === "sending" ? t().sending : t().send}</button>
  </form>`;
}

function renderResults() {
  const { per, total } = scores();
  const b = band(total);
  const w = wins();
  app.innerHTML = `<div class="screen">${progress()}
  <div class="results">
    <div>${billHTML(state.info.name.trim(), state.info.city.trim() + " · " + cuisine(), per.map((x) => ({ name: x.p.name[state.lang], s: x.s, m: x.m })), total, false)}
      <div class="nav"><button class="btn ghost" type="button" id="restart">${t().restart}</button></div></div>
    <div>
      <div class="verdict"><span class="label muted">${t().yourScore} · ${total}/100</span><h2>${b[1]}</h2><p>${b[2]}</p></div>
      <span class="label muted">${t().winsTitle}</span>
      <ol class="wins">${w.map((x, i) => `<li><span class="num">${i + 1}</span><h3>${fill(x.q.fix[state.lang][0])}</h3><div><p class="muted">${fill(x.q.fix[state.lang][1])}</p><p class="gain label muted" style="margin-top:8px">${esc(t().gain(x.gap, x.p.name[state.lang]))}</p></div></li>`).join("")}</ol>
      <div id="lead-slot">${leadHTML()}</div>
    </div>
  </div></div>`;
  document.getElementById("restart").addEventListener("click", () => { state.answers = {}; state.status = "idle"; save(); go(0); });
  wireLead();
}

function wireLead() {
  const f = document.getElementById("f-lead");
  if (f) {
    ["first", "email", "phone"].forEach((k) => document.getElementById("l-" + k).addEventListener("input", (e) => { state.lead[k] = e.target.value.trim(); }));
    document.getElementById("l-ok").addEventListener("change", (e) => { state.lead.ok = e.target.checked; });
    f.addEventListener("submit", submitLead);
  }
  const cs = document.getElementById("copy-sum"); if (cs) cs.addEventListener("click", () => copyText(summaryText(), cs));
  const cm = document.getElementById("copy-mail"); if (cm) cm.addEventListener("click", () => copyText(CONTACT_EMAIL, cm, document.getElementById("mail-addr")));
}
function refreshLead() { document.getElementById("lead-slot").innerHTML = leadHTML(); wireLead(); }

async function submitLead(e) {
  e.preventDefault();
  const l = state.lead;
  if (document.getElementById("l-hp").value) return;
  if (!l.first || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(l.email) || !l.ok) { state.error = t().leadErr; refreshLead(); return; }
  state.error = "";
  if (!FORM_ENDPOINT) { state.status = "mail"; refreshLead(); return; }
  state.status = "sending"; refreshLead();
  const { per, total } = scores();
  const payload = {
    _subject: t().subject(state.info.name.trim()), first_name: l.first, email: l.email, phone: l.phone,
    restaurant: state.info.name.trim(), city: state.info.city.trim(), cuisine: cuisine(), language: state.lang, source: SOURCE,
    score: total, band: band(total)[1], ...Object.fromEntries(per.map((x) => [x.p.id + "_score", `${x.s}/${x.m}`])),
    priorities: wins().map((w) => w.q.fix[state.lang][0]).join(" | "), summary: summaryText(), consent: "yes"
  };
  try {
    const r = await fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(payload) });
    state.status = r.ok ? "sent" : "mail";
  } catch (err) { state.status = "mail"; }
  refreshLead();
}

function copyText(text, btn, sel) {
  const done = () => { const o = btn.textContent; btn.textContent = t().copied; setTimeout(() => { btn.textContent = o; }, 1600); };
  const fallback = () => { if (sel) { const r = document.createRange(); r.selectNodeContents(sel); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

function go(step) { state.step = step; render(); const top = document.querySelector("main"); if (step > 0 && top) top.scrollIntoView({ behavior: "smooth", block: "start" }); }
function render() {
  renderChrome();
  if (state.step === 0) renderIntro();
  else if (state.step <= 4) renderPillar(state.step - 1);
  else renderResults();
}
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));
render();
</script>
